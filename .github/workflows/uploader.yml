name: Bot Auto Uploader FB Reels

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["queue/**"]

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests gdown
      - name: Pasang FFmpeg dan font jika belum ada
        run: |
          if ! command -v ffmpeg >/dev/null || ! fc-list | grep -qi dejavu; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          fi
      - name: Atur git
        run: |
          git config user.name "kantor-bot"
          git config user.email "bot@users.noreply.github.com"
      - name: Jalankan bot
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: python bot_uploader.py
