name: Bot Auto Uploader FB Reels

on:
  schedule:
    - cron: "*/5 * * * *"      # cek antrean tiap 5 menit (waktu bisa meleset beberapa menit)
  workflow_dispatch:            # tombol "Run workflow" manual
  push:
    branches: [main]
    paths: ["queue/**"]         # tugas baru dari panel langsung memicu bot

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests gdown
      - name: Atur git
        run: | git config user.name "kantor-bot" git config user.email "bot@users.noreply.github.com"       - name: Jalankan bot
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: python bot_uploader.py
