name: Bot Auto Uploader FB Reels

on:
  schedule:
    - cron: '0 * * * *' # Berjalan setiap jam untuk mengecek antrean
  issues:
    types: [opened, edited] # Berjalan saat ada tugas baru dibuat
  workflow_dispatch: # Bisa dijalankan manual pakai tombol

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Modul
        run: pip install requests

      - name: Jalankan Bot Uploader
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: python bot_uploader.py
